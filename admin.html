<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <script>
    // Адрес …/admin ведёт сюда же: переходим на …/admin.html
    if (/\/admin$/.test(location.pathname)) location.replace(location.pathname + '.html' + location.search + location.hash);
  </script>
  <title>Управление сайтом</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/fonts.css?v=202611081637">
  <link rel="stylesheet" href="assets/css/admin.css?v=202611081637">
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-card" id="loginForm" novalidate>
      <h1>Управление сайтом</h1>
      <p class="muted" id="loginHint">Войдите, чтобы изменить содержимое сайта.</p>
      <div id="loginFields">
        <label class="field"><span>E-mail</span><input type="email" id="loginEmail" autocomplete="username" required></label>
        <label class="field"><span>Пароль</span><input type="password" id="loginPassword" autocomplete="current-password" required></label>
      </div>
      <div id="tokenFields" hidden>
        <label class="field"><span>Токен доступа GitHub</span><input type="password" id="loginToken" autocomplete="off"></label>
        <label class="check"><input type="checkbox" id="rememberToken" checked> Запомнить на этом устройстве</label>
      </div>
      <div id="newPassFields" hidden>
        <label class="field"><span>Новый пароль (не короче 8 символов)</span><input type="password" id="newPassword" autocomplete="new-password"></label>
      </div>
      <p class="msg" id="loginMsg" role="alert"></p>
      <button class="btn primary wide" type="submit" id="loginBtn">Войти</button>
      <button class="linklike" type="button" id="forgotBtn">Забыли пароль?</button>
    </form>
  </div>

  <div id="shell" class="shell" hidden>
    <aside class="side" id="side">
      <div class="side-head">
        <strong>Управление сайтом</strong>
        <span class="mode" id="modeLabel"></span>
      </div>
      <nav id="menu" aria-label="Разделы админки"></nav>
      <div class="side-foot">
        <a class="btn ghost wide" href="index.html" target="_blank" rel="noopener">Открыть сайт</a>
        <button class="btn ghost wide" type="button" id="logoutBtn">Выйти</button>
      </div>
    </aside>
    <main class="main">
      <header class="bar">
        <button class="btn ghost menu-btn" type="button" id="menuBtn" aria-controls="side" aria-expanded="false">Разделы</button>
        <h1 id="viewTitle"></h1>
        <span class="status" id="status" aria-live="polite"></span>
        <button class="btn primary" type="button" id="saveBtn" title="Ctrl+S">Сохранить</button>
      </header>
      <div id="banners"></div>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="modal" id="cropModal" hidden role="dialog" aria-modal="true" aria-labelledby="cropTitle">
    <div class="modal-card">
      <h2 id="cropTitle">Настроить кадр</h2>
      <p class="muted">Перетащите изображение мышкой или пальцем. Ползунок меняет масштаб.</p>
      <div class="crop-stage"><div class="crop-box" id="cropBox"></div></div>
      <label class="field"><span>Масштаб</span><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1"></label>
      <div class="row-end">
        <button class="btn ghost" type="button" id="cropReset">Сбросить</button>
        <button class="btn ghost" type="button" id="cropCancel">Отмена</button>
        <button class="btn primary" type="button" id="cropOk">Готово</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js?v=202611081637"></script>
  <script src="assets/vendor/supabase.js?v=202611081637"></script>
  <script src="assets/js/core.js?v=202611081637"></script>
  <script src="assets/js/admin.js?v=202611081637"></script>
</body>
</html>
